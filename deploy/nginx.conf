# 轻记 - Nginx 防护配置（通用）
# 放置位置：站点 server{} 内（宝塔：网站 → 配置文件；手动 nginx：对应 vhost conf）

# 1) 禁止浏览器直接访问数据目录（数据库/备份/会话/日志）
location ~ ^/jsbserect/data/ {
    deny all;
    return 404;
}

# 2) 禁止 Web 目录内的脚本文件被 PHP 执行（纵深防御）
location ~* ^/jsbserect/(data|assets)/.*\.(php|phtml|phar)$ {
    deny all;
    return 404;
}

# 3) 禁止访问敏感文件
location ~* ^/jsbserect/.*\.(git|env|log|sql|bak|db)$ {
    deny all;
    return 404;
}

# 4) 上传文件不直接以静态方式访问（v1.35.0 已改为 file.php 鉴权代理，
#    以下规则作为兜底：即使遗留了静态引用也只允许图片/PDF，且禁用 PHP）
location ~ ^/jsbserect/data/uploads/ {
    types { }
    default_type application/octet-stream;
}
